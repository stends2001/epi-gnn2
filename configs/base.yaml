# Shared defaults; every other config extends this file.
# Set data.graph_file once here.

task: hhh4                 # baselines | hhh4 | graph_controls | compare_diseases | ablations | recovery | attribution
name: null                 # output folder name; default: <task>_<disease>_<level>_lead<N>
output_dir: results

data:
  disease: norovirus       # norovirus | campylobacter | influenza | chickenpox
  level: nuts3             # nuts1 | nuts2 | nuts3
  target: cases            # cases (NB on raw counts) | incidence (baselines only)
  lead: 4                  # weeks ahead
  sequence_length: 4       # input window (weeks)
  lag_num: 1
  graph_file: YOUR_GRAPH_FILE   # file name passed to retrieve_static_graph
  quantiles: [0.025, 0.1, 0.25, 0.5, 0.75, 0.9, 0.975]
  test_seasons: null       # e.g. [2015, 2016, 2017, 2018]: one run per test season
                           # (June to June), refitting everything; results pooled
  dates:                   # default test season 2018/19, before COVID-19 measures
    min_date: '2012-06-01'
    split_trainval: '2017-06-01'
    split_valtest: '2018-06-01'
    max_date: '2019-06-01'
  feature_popsize: false
  feature_popdens: false
  normalization_method: zscore   # applies to non-count features; case counts stay raw
  epiconfig: {}            # any other EpiConfig fields, passed through as-is

baselines:
  residual_scales: [log1p]       # [additive, log1p] fits both
  min_bin_obs: 30
  train_residuals: leave_one_year_out

model:                     # HHH4Model.set_model_hparams
  alpha_mode: node
  endemic_mode: loglinear
  epidemic_mode: rate
  neighbourhood_mode: rate
  node_effects: true
  node_penalty: 0.01
  seasonal_rates: true     # week-of-year terms on the epidemic / neighbourhood rates
  rate_dynamics: gru       # none | gru | lstm: recurrent, trajectory-driven rate shifts
  dynamics_hidden: 16

train:                     # HHH4Model.set_global_hparams, plus seeds
  lr: 0.005
  n_epochs: 300
  patience: 30
  shuffle: true            # new training order every epoch, so seeds differ
  calibrate_dispersion: true   # rescale NB spread to minimise val in-season WIS
  seeds: [0]
  one_step: false          # also train the model ONE week ahead and forecast data.lead weeks
                           # ahead by simulation (model 'neural_hhh4_sim'; one-step components,
                           # comparable with hhh4)
  sim_nsim: 200            # simulated paths per forecast origin for one_step

evaluation:
  season: in               # in | off | null (all weeks)
  reference: seasonal_average
  figures: true
  nodes_to_plot: [0, 1, 2]
  variants: {}             # extra neural variants to compare, e.g. {no_gru: {rate_dynamics: none}}

hhh4_py:                   # hhh4 in Python (no R needed) as reference model 'hhh4_py'
  enabled: true
  nsim: 500                # simulated paths per forecast origin
  seed: 1
  harmonics: 1             # sin/cos pairs for the seasonality of each component
  random_effects: true     # region random intercepts (independent per component)
  power_law: true          # neighbourhood weights decaying with neighbourhood order
  max_lag: 5

hhh4_r:                    # hhh4 fitted in R (package surveillance), optional cross-check 'hhh4_R'
  enabled: false           # needs R; skipped with a note if R is not installed
  rscript: Rscript         # full path if Rscript is not on the PATH
  nsim: 500                # simulated paths per forecast origin (lead > 1)
  harmonics: 1             # sin/cos pairs for the seasonality of each component
  random_effects: true     # region random intercepts in all three components
  power_law: true          # neighbourhood weights decaying with neighbourhood order
  max_lag: 5
  family: NegBin1

ablations:                 # task: ablations - each variant changes the full model once
  variants:
    no_gru:            {rate_dynamics: none}
    no_seasonal_rates: {seasonal_rates: false}
    no_neighbourhood:  {disabled_branches: [neighbourhood]}
    no_epidemic:       {disabled_branches: [epidemic]}
    no_node_effects:   {node_effects: false}

recovery:                  # task: recovery - simulate from fitted hhh4, refit, compare
  scenarios: [fitted, no_ne, strong_ne]
  lead: 1                  # components are compared one step ahead, as hhh4 defines them
  sim_seed: 1
  anchor_weights: []       # e.g. [1, 10]: also train the neural model anchored on the hhh4 split

attribution:               # task: attribution - simulation study, no data needed
  sources: [sir_c0.0, sir_c0.3, sir_c0.6, hhh4_fitted, hhh4_no_ne, hhh4_strong_ne]
  replicates: [0, 1, 2]
  side: 4                  # grid of side x side regions
  years: 9                 # 7 train, 1 val, 1 test
  lead: 4
  nsim: 200
  template_coupling: 0.3   # SIR series the hhh4 template is fitted to
  estimators: [hhh4py, neural_lead1, neural_leadL]   # + anchored
  anchor_weights: [1, 10]

graph_controls:
  n_rewired: 10
  include_identity: true

compare:
  diseases: [norovirus, campylobacter, influenza]
